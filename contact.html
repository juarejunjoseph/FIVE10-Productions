<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#4b0708">
  <meta name="description" content="Contact Five10 Productions to discuss event management, marketing solutions, activations, and brand experiences.">
  <title>Contact Us | Five10 Productions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div>
  <main id="main-content">
    <section class="contact-page section-light">
      <div class="container contact-page-grid">
        <div class="contact-page-copy reveal">
          <h1 class="display-title contact-display">LET’S MAKE<br>THINGS <em>HAPPEN!</em></h1>
          <p>Share a few details about your event, campaign, or idea. We’ll help you work out the next step.</p>
        </div>
        <form class="contact-form reveal" data-contact-form>
          <div class="form-row">
            <label for="contact-name">Your name</label>
            <input id="contact-name" name="name" autocomplete="name" required placeholder="Name">
          </div>
          <div class="form-row">
            <label for="contact-email">Email address</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
          </div>
          <div class="form-row">
            <label for="contact-phone">Contact number</label>
            <input id="contact-phone" name="phone" type="tel" autocomplete="tel" placeholder="Contact number">
          </div>
          <div class="form-row form-row-message">
            <label for="contact-message">Your message</label>
            <textarea id="contact-message" name="message" rows="5" required placeholder="Tell us a little about your project…"></textarea>
          </div>
          <button class="button form-submit" type="submit">Submit</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main><div id="site-footer"></div><div id="global-modal-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script><script src="assets/js/site-data.js"></script><script src="assets/js/components.js"></script><script src="assets/js/main.js"></script>
</body></html>
